name: "CI: Checks"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: mathewmusango/my-workflows/.github/workflows/checks-python.yml@b3ebec60c21da32a6de90e56745367e0e7581ebd # 2026-11-17
  js:
    uses: mathewmusango/my-workflows/.github/workflows/checks-js.yml@b3ebec60c21da32a6de90e56745367e0e7581ebd # 2026-11-17
  shell:
    uses: mathewmusango/my-workflows/.github/workflows/checks-shell.yml@b3ebec60c21da32a6de90e56745367e0e7581ebd # 2026-11-17
  yaml:
    uses: mathewmusango/my-workflows/.github/workflows/checks-yaml.yml@b3ebec60c21da32a6de90e56745367e0e7581ebd # 2026-11-17
  docker:
    uses: mathewmusango/my-workflows/.github/workflows/checks-docker.yml@b3ebec60c21da32a6de90e56745367e0e7581ebd # 2026-11-17
