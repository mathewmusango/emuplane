name: "CI: Checks"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# `pull-requests: read` is for the leaves' `dorny/paths-filter`: a called workflow
# can only downgrade the token it is given, never raise it, so the grant has to be
# made here.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: mathewmusango/my-workflows/.github/workflows/checks-python.yml@b3e68febda512c508d6cf7fd934f32a9d1cb35c9 # v2026.1113.0738Z
  js:
    uses: mathewmusango/my-workflows/.github/workflows/checks-js.yml@b3e68febda512c508d6cf7fd934f32a9d1cb35c9 # v2026.1113.0738Z
  shell:
    uses: mathewmusango/my-workflows/.github/workflows/checks-shell.yml@b3e68febda512c508d6cf7fd934f32a9d1cb35c9 # v2026.1113.0738Z
  yaml:
    uses: mathewmusango/my-workflows/.github/workflows/checks-yaml.yml@b3e68febda512c508d6cf7fd934f32a9d1cb35c9 # v2026.1113.0738Z
  docker:
    uses: mathewmusango/my-workflows/.github/workflows/checks-docker.yml@b3e68febda512c508d6cf7fd934f32a9d1cb35c9 # v2026.1113.0738Z
