name: "CI: Checks"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: mathewmusango/my-workflows/.github/workflows/checks-python.yml@0ef43783345a729741ec96a7afbd57baf957ce06 # v2026.1120.1735Z
  js:
    uses: mathewmusango/my-workflows/.github/workflows/checks-js.yml@0ef43783345a729741ec96a7afbd57baf957ce06 # v2026.1120.1735Z
  shell:
    uses: mathewmusango/my-workflows/.github/workflows/checks-shell.yml@0ef43783345a729741ec96a7afbd57baf957ce06 # v2026.1120.1735Z
  yaml:
    uses: mathewmusango/my-workflows/.github/workflows/checks-yaml.yml@0ef43783345a729741ec96a7afbd57baf957ce06 # v2026.1120.1735Z
  docker:
    uses: mathewmusango/my-workflows/.github/workflows/checks-docker.yml@0ef43783345a729741ec96a7afbd57baf957ce06 # v2026.1120.1735Z
