name: "CI: Checks"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: mathewmusango/my-workflows/.github/workflows/checks-python.yml@279532bc4b3b602d7753d118ded3cd8d768aed36 # v2026.1120.2118Z
  js:
    uses: mathewmusango/my-workflows/.github/workflows/checks-js.yml@279532bc4b3b602d7753d118ded3cd8d768aed36 # v2026.1120.2118Z
  shell:
    uses: mathewmusango/my-workflows/.github/workflows/checks-shell.yml@279532bc4b3b602d7753d118ded3cd8d768aed36 # v2026.1120.2118Z
  yaml:
    uses: mathewmusango/my-workflows/.github/workflows/checks-yaml.yml@279532bc4b3b602d7753d118ded3cd8d768aed36 # v2026.1120.2118Z
  docker:
    uses: mathewmusango/my-workflows/.github/workflows/checks-docker.yml@279532bc4b3b602d7753d118ded3cd8d768aed36 # v2026.1120.2118Z
