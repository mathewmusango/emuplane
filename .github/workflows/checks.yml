name: "CI: Checks"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: mathewmusango/my-workflows/.github/workflows/checks-python.yml@636bd04bbf5d526fc2f1c2aa89788fcdd2a27356 # v2026.1120.1636Z
  js:
    uses: mathewmusango/my-workflows/.github/workflows/checks-js.yml@636bd04bbf5d526fc2f1c2aa89788fcdd2a27356 # v2026.1120.1636Z
  shell:
    uses: mathewmusango/my-workflows/.github/workflows/checks-shell.yml@636bd04bbf5d526fc2f1c2aa89788fcdd2a27356 # v2026.1120.1636Z
  yaml:
    uses: mathewmusango/my-workflows/.github/workflows/checks-yaml.yml@636bd04bbf5d526fc2f1c2aa89788fcdd2a27356 # v2026.1120.1636Z
  docker:
    uses: mathewmusango/my-workflows/.github/workflows/checks-docker.yml@636bd04bbf5d526fc2f1c2aa89788fcdd2a27356 # v2026.1120.1636Z
