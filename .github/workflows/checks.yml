name: "CI: Checks"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# `pull-requests: read` is for the leaves' `dorny/paths-filter`: a called workflow
# can only downgrade the token it is given, never raise it, so the grant has to be
# made here.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: mathewmusango/my-workflows/.github/workflows/checks-python.yml@d00fec710bc056ae055e10782eae126b7a1d0b61 # v2026.1113.1341Z
  js:
    uses: mathewmusango/my-workflows/.github/workflows/checks-js.yml@d00fec710bc056ae055e10782eae126b7a1d0b61 # v2026.1113.1341Z
  shell:
    uses: mathewmusango/my-workflows/.github/workflows/checks-shell.yml@d00fec710bc056ae055e10782eae126b7a1d0b61 # v2026.1113.1341Z
  yaml:
    uses: mathewmusango/my-workflows/.github/workflows/checks-yaml.yml@d00fec710bc056ae055e10782eae126b7a1d0b61 # v2026.1113.1341Z
  docker:
    uses: mathewmusango/my-workflows/.github/workflows/checks-docker.yml@d00fec710bc056ae055e10782eae126b7a1d0b61 # v2026.1113.1341Z
