name: "CI: Checks"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: mathewmusango/my-workflows/.github/workflows/checks-python.yml@988ca2b0ea859a18e1dd75e6acadce904acdd278 # v2026.1120.2157Z
  js:
    uses: mathewmusango/my-workflows/.github/workflows/checks-js.yml@988ca2b0ea859a18e1dd75e6acadce904acdd278 # v2026.1120.2157Z
  shell:
    uses: mathewmusango/my-workflows/.github/workflows/checks-shell.yml@988ca2b0ea859a18e1dd75e6acadce904acdd278 # v2026.1120.2157Z
  yaml:
    uses: mathewmusango/my-workflows/.github/workflows/checks-yaml.yml@988ca2b0ea859a18e1dd75e6acadce904acdd278 # v2026.1120.2157Z
  docker:
    uses: mathewmusango/my-workflows/.github/workflows/checks-docker.yml@988ca2b0ea859a18e1dd75e6acadce904acdd278 # v2026.1120.2157Z
