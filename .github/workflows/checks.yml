name: "CI: Checks"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# `pull-requests: read` is for the leaves' `dorny/paths-filter`: a called workflow
# can only downgrade the token it is given, never raise it, so the grant has to be
# made here.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: mathewmusango/my-workflows/.github/workflows/checks-python.yml@b6dd35e704c8b95d70d9b068f64f59b18bef167c # v2026.1112.2318Z
  js:
    uses: mathewmusango/my-workflows/.github/workflows/checks-js.yml@b6dd35e704c8b95d70d9b068f64f59b18bef167c # v2026.1112.2318Z
  shell:
    uses: mathewmusango/my-workflows/.github/workflows/checks-shell.yml@b6dd35e704c8b95d70d9b068f64f59b18bef167c # v2026.1112.2318Z
  yaml:
    uses: mathewmusango/my-workflows/.github/workflows/checks-yaml.yml@b6dd35e704c8b95d70d9b068f64f59b18bef167c # v2026.1112.2318Z
  docker:
    uses: mathewmusango/my-workflows/.github/workflows/checks-docker.yml@b6dd35e704c8b95d70d9b068f64f59b18bef167c # v2026.1112.2318Z
