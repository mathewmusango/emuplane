name: "CI: Checks"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: mathewmusango/my-workflows/.github/workflows/checks-python.yml@231bfd6be26e1cfe1a4a07c2a81f36296ab7b26b # 2026-11-17
  js:
    uses: mathewmusango/my-workflows/.github/workflows/checks-js.yml@231bfd6be26e1cfe1a4a07c2a81f36296ab7b26b # 2026-11-17
  shell:
    uses: mathewmusango/my-workflows/.github/workflows/checks-shell.yml@231bfd6be26e1cfe1a4a07c2a81f36296ab7b26b # 2026-11-17
  yaml:
    uses: mathewmusango/my-workflows/.github/workflows/checks-yaml.yml@231bfd6be26e1cfe1a4a07c2a81f36296ab7b26b # 2026-11-17
  docker:
    uses: mathewmusango/my-workflows/.github/workflows/checks-docker.yml@231bfd6be26e1cfe1a4a07c2a81f36296ab7b26b # 2026-11-17
