name: "CI: Checks"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: mathewmusango/my-workflows/.github/workflows/checks-python.yml@515571ed5ee87ac5e1d97f810ff440d862652944 # v2026.1118.1749Z
  js:
    uses: mathewmusango/my-workflows/.github/workflows/checks-js.yml@515571ed5ee87ac5e1d97f810ff440d862652944 # v2026.1118.1749Z
  shell:
    uses: mathewmusango/my-workflows/.github/workflows/checks-shell.yml@515571ed5ee87ac5e1d97f810ff440d862652944 # v2026.1118.1749Z
  yaml:
    uses: mathewmusango/my-workflows/.github/workflows/checks-yaml.yml@515571ed5ee87ac5e1d97f810ff440d862652944 # v2026.1118.1749Z
  docker:
    uses: mathewmusango/my-workflows/.github/workflows/checks-docker.yml@515571ed5ee87ac5e1d97f810ff440d862652944 # v2026.1118.1749Z
