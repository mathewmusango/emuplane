name: docs

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EP_EMULATOR_SRC: ${{ runner.temp }}/ministack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Check out the emulator at the tested tag
        # The coverage page is generated from the emulator's own operation list.
        run: git clone --quiet --depth 1 --branch v1.5.41 https://github.com/ministackorg/ministack "$EP_EMULATOR_SRC"
      - run: npm ci
      - name: Generated reference pages are current
        run: |
          npm run api
          npm run s3:coverage
          git diff --exit-code -- docs
      - name: Build the site
        run: npm run build
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
