name: "Issue: carries a changelog label"

# An issue names the section it belongs to, so nothing reaches the changelog by
# falling into a default. Bots are exempt: their dashboards are not changelog entries.
on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog-label:
    if: github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: The label maps to a section
        run: python3 scripts/triage.py --issue
