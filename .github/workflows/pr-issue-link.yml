name: "PR: links an issue"

# A pull request names the issue it closes, because the changelog is built from
# issues. Dependency bots and release pull requests are exempt: neither closes one.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  links-an-issue:
    if: >-
      github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' &&
      !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: The body closes an issue
        run: python3 scripts/triage.py --pr
