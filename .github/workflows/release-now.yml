name: "Release: now"

# Press to release. The version comes from the closed issues, so no tag is typed.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Allow a minor or a major, which the policy leaves to a pull request
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: The version the closed issues imply
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release.py | tee decision.json
          action=$(python3 -c "import json; print(json.load(open('decision.json'))['action'])")
          version=$(python3 -c "import json; print(json.load(open('decision.json'))['version'])")
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Refuse what the policy leaves to a person
        if: steps.decide.outputs.action == 'pull-request' && inputs.force == false
        run: |
          echo "::error::${{ steps.decide.outputs.tag }} is a minor or a major. Merge a release pull request, or press again with force."
          exit 1
      - name: Say there is nothing to release
        if: steps.decide.outputs.action == 'nothing'
        run: echo "::notice::No closed issue since the last release is changelog material."
      - name: Write the section, unless it is already there
        if: steps.decide.outputs.action != 'nothing'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          if python3 scripts/changelog.py --version "$tag" --check; then
            echo "CHANGELOG.md already carries $tag"
          else
            python3 scripts/changelog.py --version "$tag" --write
          fi
      - name: Commit, tag and push
        if: steps.decide.outputs.action != 'nothing'
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release $tag"
            git push
          fi
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
      - name: Start the release at the tag
        if: steps.decide.outputs.action != 'nothing'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "${{ steps.decide.outputs.tag }}"
