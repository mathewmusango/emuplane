name: "Release: plan"

# A release is prepared as a pull request, on a branch the bot owns. The version
# comes from the closed issues, so nothing is typed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A burst of merges queues its plans instead of killing one mid-write.
  group: release-plan
  cancel-in-progress: false

jobs:
  plan:
    permissions:
      contents: write
      pull-requests: write
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The token that decides whether this branch runs checks
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning::RELEASE_TOKEN is unset: the release branch and its pull request are made with GITHUB_TOKEN, so the pull request carries no checks."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: The version the closed issues imply
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release.py | tee decision.json
          action=$(python3 -c "import json; print(json.load(open('decision.json'))['action'])")
          version=$(python3 -c "import json; print(json.load(open('decision.json'))['version'])")
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Say there is nothing to release
        if: steps.decide.outputs.action == 'nothing'
        run: echo "::notice::No closed issue since the last release is changelog material."
      - name: Write the section on a release branch
        id: write
        if: steps.decide.outputs.action != 'nothing'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          if python3 scripts/changelog.py --version "$tag" --check; then
            echo "::notice::$tag is already in CHANGELOG.md"
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "release/$tag"
          python3 scripts/changelog.py --version "$tag" --write
          sed -i "s|ghcr.io/mathewmusango/emuplane:[0-9][0-9.]*|ghcr.io/mathewmusango/emuplane:${tag#v}|" docker-compose.yml
          sed -i "s|ghcr.io/mathewmusango/emuplane:[0-9][0-9.]*|ghcr.io/mathewmusango/emuplane:${tag#v}|" docker-compose.all.yml
          # A page that names a release outright follows it, like the compose pins.
          pages=$(grep -rl "ghcr.io/mathewmusango/emuplane:" site/docs || true)
          while IFS= read -r page; do
            [ -n "$page" ] || continue
            sed -i -E "s|ghcr\.io/mathewmusango/emuplane:(v?)[0-9]+\.[0-9]+\.[0-9]+|ghcr.io/mathewmusango/emuplane:\1${tag#v}|g" "$page"
          done <<< "$pages"
          npm --prefix site ci --no-audit --no-fund
          npm --prefix site run version "${tag#v}"
          npm --prefix site run changelog
          python3 scripts/units.py --version "$tag" --check --skip-tag
          # versions.json now serves the new release, so the claims have to name it too
          python3 scripts/badge.py --bump-versions
          git add --all
          git commit --message "Release $tag"
          git push --force origin "HEAD:refs/heads/release/$tag"
          echo "prepared=true" >> "$GITHUB_OUTPUT"
      - name: Open or update the release pull request
        if: steps.write.outputs.prepared == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          python3 - "$tag" > body.md <<'PY'
          import pathlib, re, sys

          tag = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          found = re.search(rf"^## \[{re.escape(tag)}\].*?(?=^## \[|\Z)", text, re.M | re.S)
          print(found.group(0).strip() if found else "")
          PY
          python3 scripts/changelog.py --documentation >> body.md
          if gh pr list --head "release/$tag" --json number --jq 'length' | grep -qv '^0$'; then
            gh pr edit "release/$tag" --body-file body.md
          else
            gh pr create --base main --head "release/$tag" \
              --title "Release $tag" --body-file body.md
          fi
