name: "Release: Image"

# A release is a tag push (v0.1.0). The library leaf builds the image, scans it
# with Trivy, and only then pushes, so a failing scan never leaves a tag in GHCR;
# the GitHub release follows the image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Not part of the library: the tag really has to be the commit that was
  # released, and a tag ruleset cannot express that (the ref lands first).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must be the tip of main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse "$GITHUB_SHA^{commit}")" != "$(git rev-parse origin/main)" ]; then
            echo "::error::$GITHUB_REF_NAME is not the tip of main: tag the commit you released, nothing older."
            exit 1
          fi

  image:
    needs: guard
    permissions:
      contents: read
      packages: write
    uses: mathewmusango/my-workflows/.github/workflows/release-image-ghcr.yml@d00fec710bc056ae055e10782eae126b7a1d0b61 # v2026.1113.1341Z

  release:
    needs: image
    permissions:
      contents: write
    uses: mathewmusango/my-workflows/.github/workflows/release-github.yml@d00fec710bc056ae055e10782eae126b7a1d0b61 # v2026.1113.1341Z
