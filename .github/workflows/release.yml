name: "Release: Image"

# A release is a tag push (v0.1.0). The library leaf builds the image, scans it
# with Trivy, and only then pushes, so a failing scan never leaves a tag in GHCR;
# the GitHub release follows the image.
on:
  push:
    tags: ["v*"]
  # Also startable at a tag by `.github/workflows/release-now.yml`, which is exempt from
  # the GITHUB_TOKEN recursion guard and is how a pressed release reaches this run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Not part of the library: the tag really has to be the commit that was
  # released, and a tag ruleset cannot express that (the ref lands first).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      notes: ${{ steps.section.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must be the tip of main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse "$GITHUB_SHA^{commit}")" != "$(git rev-parse origin/main)" ]; then
            echo "::error::$GITHUB_REF_NAME is not the tip of main: tag the commit you released, nothing older."
            exit 1
          fi
      - name: The changelog has a section for this tag
        id: section
        run: |
          set -euo pipefail
          python3 scripts/changelog.py --version "$GITHUB_REF_NAME" --check
          python3 - "$GITHUB_REF_NAME" > notes.md <<'PY'
          import pathlib, re, sys

          tag = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          found = re.search(rf"^## \[{re.escape(tag)}\].*?(?=^## \[|\Z)", text, re.M | re.S)
          print(found.group(0).strip() if found else "")
          PY
          {
            echo "notes<<RELEASE_NOTES"
            cat notes.md
            echo "RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: guard
    permissions:
      contents: read
      packages: write
    uses: mathewmusango/my-workflows/.github/workflows/release-image-ghcr.yml@988ca2b0ea859a18e1dd75e6acadce904acdd278 # v2026.1120.2157Z

  release:
    needs: [image, guard]
    permissions:
      contents: write
    uses: mathewmusango/my-workflows/.github/workflows/release-github.yml@988ca2b0ea859a18e1dd75e6acadce904acdd278 # v2026.1120.2157Z
    with:
      body: ${{ needs.guard.outputs.notes }}

  artifacts:
    needs: [image, release]
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The image this tag published
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: The image's SBOM, read from the attestation the build attached
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ steps.image.outputs.ref }}" \
            --format '{{json .SBOM}}' > sbom-attestation.json
          python3 - <<'PY'
          import json, os, pathlib, sys

          raw = pathlib.Path("sbom-attestation.json").read_text(encoding="utf-8").strip()
          data = json.loads(raw or "{}")
          spdx = (
              data.get("SPDX")
              or data.get("SPDX-2.3")
              or next((value for key, value in data.items() if key.startswith("SPDX")), None)
          )
          if not spdx:
              sys.exit("the image carries no SPDX attestation: was it built with sbom: true?")
          name = f"emuplane-{os.environ['GITHUB_REF_NAME']}.spdx.json"
          pathlib.Path(name).write_text(json.dumps(spdx, indent=2) + "\n", encoding="utf-8")
          print(f"wrote {name}")
          PY
      - name: The compose bundle
        # The files a reader needs to run this exact version without cloning: both
        # stacks, both environment examples, and the two commands that matter.
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          mkdir -p bundle
          cp docker-compose.yml docker-compose.all.yml .env.example .env.all.example bundle/
          cat > bundle/README.txt <<TXT
          Emuplane ${version}: the compose files and their environment examples.

          Every stack here pins the image this release published:
            ghcr.io/${GITHUB_REPOSITORY}:${version#v}

          The whole stack, emulator included:
            cp .env.all.example .env.all
            docker compose --env-file .env.all -f docker-compose.all.yml up -d

          The control only, against an emulator you already run:
            cp .env.example .env        # set EP_BACKEND_URL
            docker compose up -d

          Docs: https://mathewmusango.github.io/emuplane/docs/deployment/docker-podman
          TXT
          # Reproducible: same inputs, same bytes, so the checksum means something.
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - -C bundle . \
            | gzip -n > "emuplane-${version}-compose.tar.gz"
          tar -tzf "emuplane-${version}-compose.tar.gz"

      - name: Checksums and the digest the tag resolves to
        run: |
          set -euo pipefail
          sha256sum "emuplane-$GITHUB_REF_NAME.spdx.json" \
            "emuplane-$GITHUB_REF_NAME-compose.tar.gz" > SHA256SUMS
          docker buildx imagetools inspect "${{ steps.image.outputs.ref }}" \
            --format '{{.Manifest.Digest}}' > IMAGE-DIGEST
          cat SHA256SUMS IMAGE-DIGEST
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          "emuplane-$GITHUB_REF_NAME.spdx.json" "emuplane-$GITHUB_REF_NAME-compose.tar.gz"
          SHA256SUMS IMAGE-DIGEST
          --repo "$GITHUB_REPOSITORY" --clobber
