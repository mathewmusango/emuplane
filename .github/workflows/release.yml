name: "Release: Image"

# A release is a tag push (v0.1.0). The library leaf builds the image, scans it
# with Trivy, and only then pushes, so a failing scan never leaves a tag in GHCR;
# the GitHub release follows the image.
on:
  push:
    tags: ["v*"]
  # Also startable at a tag by `.github/workflows/release-now.yml`, which is exempt from
  # the GITHUB_TOKEN recursion guard and is how a pressed release reaches this run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Not part of the library: the tag really has to be the commit that was
  # released, and a tag ruleset cannot express that (the ref lands first).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must be the tip of main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse "$GITHUB_SHA^{commit}")" != "$(git rev-parse origin/main)" ]; then
            echo "::error::$GITHUB_REF_NAME is not the tip of main: tag the commit you released, nothing older."
            exit 1
          fi
      - name: The changelog has a section for this tag
        run: python3 scripts/changelog.py --version "$GITHUB_REF_NAME" --check

  image:
    needs: guard
    permissions:
      contents: read
      packages: write
    uses: mathewmusango/my-workflows/.github/workflows/release-image-ghcr.yml@d00fec710bc056ae055e10782eae126b7a1d0b61 # v2026.1113.1341Z

  release:
    needs: image
    permissions:
      contents: write
    uses: mathewmusango/my-workflows/.github/workflows/release-github.yml@d00fec710bc056ae055e10782eae126b7a1d0b61 # v2026.1113.1341Z

  artifacts:
    needs: [image, release]
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: The image this tag published
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: The image's SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.ref }}
          format: spdx-json
          output-file: emuplane-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums and the digest the tag resolves to
        run: |
          set -euo pipefail
          sha256sum "emuplane-$GITHUB_REF_NAME.spdx.json" > SHA256SUMS
          docker buildx imagetools inspect "${{ steps.image.outputs.ref }}" \
            --format '{{.Manifest.Digest}}' > IMAGE-DIGEST
          cat SHA256SUMS IMAGE-DIGEST
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          "emuplane-$GITHUB_REF_NAME.spdx.json" SHA256SUMS IMAGE-DIGEST --clobber
