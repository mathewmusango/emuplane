name: "CI: Security"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency review needs the dependency graph and GHAS, so it only runs once the
  # repository is public.
  deps:
    if: ${{ !github.event.repository.private }}
    uses: mathewmusango/my-workflows/.github/workflows/security-deps.yml@b3e68febda512c508d6cf7fd934f32a9d1cb35c9 # v2026.1113.0738Z
  npm-audit:
    uses: mathewmusango/my-workflows/.github/workflows/security-npm-audit.yml@b3e68febda512c508d6cf7fd934f32a9d1cb35c9 # v2026.1113.0738Z
