name: "CI: Security"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency review needs the dependency graph and GHAS, so it only runs once the
  # repository is public.
  deps:
    if: ${{ !github.event.repository.private }}
    uses: mathewmusango/my-workflows/.github/workflows/security-dependency-review.yml@b3ebec60c21da32a6de90e56745367e0e7581ebd # 2026-11-17
  npm-audit:
    uses: mathewmusango/my-workflows/.github/workflows/security-npm-audit.yml@b3ebec60c21da32a6de90e56745367e0e7581ebd # 2026-11-17
