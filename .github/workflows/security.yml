name: "CI: Security"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency review needs the dependency graph and GHAS, so it only runs once the
  # repository is public.
  deps:
    if: ${{ !github.event.repository.private }}
    uses: mathewmusango/my-workflows/.github/workflows/security-dependency-review.yml@636bd04bbf5d526fc2f1c2aa89788fcdd2a27356 # v2026.1120.1636Z
  # The reusable workflow audits at a fixed threshold and takes no allowlist; picomatch has no fix, so this names what is accepted.
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Audit every lockfile against the allowlist
        run: python3 scripts/npm_audit.py
