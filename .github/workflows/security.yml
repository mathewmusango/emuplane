name: "CI: Security"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency review needs the dependency graph and GHAS, so it only runs once the
  # repository is public.
  deps:
    if: ${{ !github.event.repository.private }}
    uses: mathewmusango/my-workflows/.github/workflows/security-dependency-review.yml@988ca2b0ea859a18e1dd75e6acadce904acdd278 # v2026.1120.2157Z
  # Kept for one release while OSV-Scanner is proven: its allowlist no longer matches anything.
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Audit every lockfile against the allowlist
        run: python3 scripts/npm_audit.py
  # OSV-Scanner reads every lockfile, including the hash-pinned requirements.txt no npm audit sees.
  osv:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
