name: "CI: Security"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency review needs the dependency graph and GHAS, so it only runs once the
  # repository is public.
  deps:
    if: ${{ !github.event.repository.private }}
    uses: mathewmusango/my-workflows/.github/workflows/security-deps.yml@b6dd35e704c8b95d70d9b068f64f59b18bef167c # v2026.1112.2318Z
  npm-audit:
    uses: mathewmusango/my-workflows/.github/workflows/security-npm-audit.yml@b6dd35e704c8b95d70d9b068f64f59b18bef167c # v2026.1112.2318Z
