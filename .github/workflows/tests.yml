name: "CI: Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    uses: mathewmusango/my-workflows/.github/workflows/tests-vitest.yml@d00fec710bc056ae055e10782eae126b7a1d0b61 # v2026.1113.1341Z
    with:
      working-directory: web
