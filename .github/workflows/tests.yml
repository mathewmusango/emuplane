name: "CI: Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    uses: mathewmusango/my-workflows/.github/workflows/tests-vitest.yml@b6dd35e704c8b95d70d9b068f64f59b18bef167c # v2026.1112.2318Z
    with:
      working-directory: web
