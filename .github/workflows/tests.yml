name: "CI: Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    uses: mathewmusango/my-workflows/.github/workflows/tests-vitest.yml@636bd04bbf5d526fc2f1c2aa89788fcdd2a27356 # v2026.1120.1636Z
    with:
      working-directory: web

  # The S3 and access-point tests import the emulator's own service modules, so they
  # run against a checkout of the tag the images carry rather than a mock of it.
  # The whole supported range is here, and the badge in the README repeats it.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14', '3.15']
    env:
      EMULATOR_TAG: v1.5.40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Where the emulator source goes
        run: echo "EP_EMULATOR_SRC=$RUNNER_TEMP/ministack" >> "$GITHUB_ENV"
      - name: Check out the emulator at the tested tag
        run: git clone --quiet --depth 1 --branch "$EMULATOR_TAG" https://github.com/ministackorg/ministack "$EP_EMULATOR_SRC"
      - name: Install pytest and the dependencies
        run: pip install --quiet pytest -r requirements.txt -r "$EP_EMULATOR_SRC/requirements.txt"
      - name: Run the suite
        run: python3 -m pytest -q tests
      - name: The published coverage page is current
        run: python3 scripts/coverage.py --check
      - name: Ledger, secrets and compile checks
        run: python3 scripts/qa_check.py
