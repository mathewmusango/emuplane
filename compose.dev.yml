# Dev overlay: mounts the built console and the control source, so no image build.
# Files are mounted one by one because the image flattens `control/` into `/app/`.

services:
  emuplane:
    volumes:
      - ./web/dist:/app/static:ro,Z
      - ./control/app.py:/app/app.py:ro,Z
      - ./control/buckets.py:/app/buckets.py:ro,Z
      - ./control/console.py:/app/console.py:ro,Z
      - ./control/signed.py:/app/signed.py:ro,Z
      - ./control/s3extra.py:/app/s3extra.py:ro,Z
      - ./control/accesspoints.py:/app/accesspoints.py:ro,Z
      - ./control/dynamo.py:/app/dynamo.py:ro,Z
      - ./control/store.py:/app/store.py:ro,Z
      - ./control/api_token.py:/app/api_token.py:ro,Z
      - ./control/password.py:/app/password.py:ro,Z
      - ./control/backends.py:/app/backends.py:ro,Z
      - ./control/mail.py:/app/mail.py:ro,Z
