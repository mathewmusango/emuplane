# ministack-control — gateway, console and accounts for the MiniStack emulator.
#
#   ./scripts/up.sh
#
# The emulator is its own service (`services/ministack`): one container, every
# region and every account. This container is the front door:
#   - 127.0.0.1:4571 is the single AWS gateway, aware of region and account;
#   - 127.0.0.1:4570 is the login-gated control API and console;
#   - bucket names are reserved in one registry, so a name cannot exist twice
#     (AWS keeps S3 names unique across accounts and regions alike).
#
# Env comes from ./.env (MC_* settings) and this file carries structure only.
# The control reaches the emulator by container name over net-services, never
# by a host port.

name: core_ministack-control

services:
  ministack-control:
    build:
      context: .
      dockerfile: Dockerfile
    image: "localhost/ministack-control:${MC_IMAGE_TAG:-dev}"
    container_name: core-ministack-control
    hostname: core-ministack-control
    restart: "no"
    labels:
      app: "ministack-control"
      tier: "core"
      managed-by: "my-labs"
      traefik.enable: "true"
      # Dashboard + control API over TLS.
      traefik.http.routers.ministack.rule: "Host(`ministack.mus.com`)"
      traefik.http.routers.ministack.entrypoints: "websecure"
      traefik.http.routers.ministack.tls: "true"
      traefik.http.routers.ministack.middlewares: "hsts@file"
      traefik.http.routers.ministack.service: "ministack"
      traefik.http.services.ministack.loadbalancer.server.port: "8080"
      # The AWS gateway over TLS. Clients sign Host: aws.mus.com, and the
      # gateway forwards that Host untouched so SigV4 still verifies.
      traefik.http.routers.ministack-aws.rule: "Host(`aws.mus.com`)"
      traefik.http.routers.ministack-aws.entrypoints: "websecure"
      traefik.http.routers.ministack-aws.tls: "true"
      traefik.http.routers.ministack-aws.middlewares: "hsts@file"
      traefik.http.routers.ministack-aws.service: "ministack-aws"
      traefik.http.services.ministack-aws.loadbalancer.server.port: "4566"
    command: ["python", "/app/app.py"]
    env_file:
      - ./.env
    environment:
      CONTROL_REGISTRY_FILE: /var/lib/ministack/control/registry.json
      CONTROL_PORT: "8080"
      CONTROL_GATEWAY_PORT: "4566"
      MINISTACK_NODE_URL: http://core-ministack:4566
    ports:
      - "127.0.0.1:${MC_UI_PORT:-4570}:8080"
      - "127.0.0.1:${MC_GATEWAY_PORT:-4571}:4566"
    volumes:
      # Accounts, sessions, the bucket registry, ownership and the audit trail.
      - "${MC_DATA_DIR:-/srv/myinfra/containers/ministack-control/data}:/var/lib/ministack/control:Z"
      - /etc/localtime:/etc/localtime:ro
    networks:
      - net-services
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

networks:
  net-services:
    external: true
