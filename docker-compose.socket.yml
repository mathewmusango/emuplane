name: emuplane

# Opt-in overlay: give the emulator the container runtime's socket so ECS, RDS,
# DocumentDB and EKS can start sibling containers.
#
#   docker compose --env-file .env.all -f docker-compose.all.yml -f docker-compose.socket.yml up -d
#
# Podman, with its rootless socket:
#
#   DOCKER_SOCKET=/run/user/$(id -u)/podman/podman.sock \
#     podman-compose --env-file .env.all -f docker-compose.all.yml -f docker-compose.socket.yml up -d
#
# Nothing sets DOCKER_HOST: the socket is mounted where the Docker client looks
# by default, so one file serves both runtimes.
services:
  ministack:
    volumes:
      - "${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
