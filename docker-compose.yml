name: emuplane

# The container contract: these variables, and only these, reach the control.
x-runtime: &runtime
  TZ: "${TZ:-Africa/Nairobi}"
  # The backend profile (control/backends.py) and its connection string.
  EP_BACKEND: "${EP_BACKEND:-ministack}"
  EP_BACKEND_URL: "${EP_BACKEND_URL:?set EP_BACKEND_URL in .env to the backend's endpoint}"
  EP_CONSOLE_URL: "${EP_CONSOLE_URL:?set EP_CONSOLE_URL in .env: http://localhost:4570 without a reverse proxy}"
  EP_GATEWAY_URL: "${EP_GATEWAY_URL:?set EP_GATEWAY_URL in .env: http://localhost:4571 without a reverse proxy}"
  EP_PORT: "${EP_PORT:-4570}"
  EP_GATEWAY_PORT: "${EP_GATEWAY_PORT:-4571}"
  EP_POLL_SECONDS: "${EP_POLL_SECONDS:-10}"
  EP_SESSION_SECONDS: "${EP_SESSION_SECONDS:-28800}"
  EP_RECENT_LIMIT: "${EP_RECENT_LIMIT:-5}"
  EP_STORE_ACCOUNT: "${EP_STORE_ACCOUNT:-111111111111}"
  EP_STORE_REGION: "${EP_STORE_REGION:-us-east-1}"
  EP_STORE_URL: "${EP_STORE_URL:-}"
  # Mail for the reset link; an empty host turns mail off.
  EP_MAIL_HOST: "${EP_MAIL_HOST:-}"
  EP_MAIL_PORT: "${EP_MAIL_PORT:-587}"
  EP_MAIL_SECURITY: "${EP_MAIL_SECURITY:-starttls}"
  EP_MAIL_USER: "${EP_MAIL_USER:-}"
  EP_MAIL_PASSWORD: "${EP_MAIL_PASSWORD:-}"
  EP_MAIL_FROM: "${EP_MAIL_FROM:-}"
  EP_RESET_SECONDS: "${EP_RESET_SECONDS:-1800}"

services:
  # First-setup job: applies bootstrap/template.yml as the `emuplane` stack.
  bootstrap:
    image: "ghcr.io/mathewmusango/emuplane:0.1.0"
    command: ["python", "/app/bootstrap/apply.py"]
    restart: "no"
    environment:
      <<: *runtime
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  emuplane:
    image: "ghcr.io/mathewmusango/emuplane:0.1.0"
    restart: "no"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *runtime
    ports:
      - "127.0.0.1:${EP_PORT:-4570}:${EP_PORT:-4570}"
      - "127.0.0.1:${EP_GATEWAY_PORT:-4571}:${EP_GATEWAY_PORT:-4571}"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('EP_PORT', '4570'), timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
