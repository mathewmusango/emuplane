name: ministack-control

services:
  ministack-control:
    image: "${MC_IMAGE:-ghcr.io/mathewmusango/ministack-control:latest}"
    restart: "no"
    env_file:
      - path: ./.env
        required: false
    environment:
      # The zone the console renders timestamps in. A named zone beats mounting
      # the host's /etc/localtime: it travels with the deployment, works on any
      # host, and the image already ships zoneinfo (Alpine's tzdata).
      TZ: "${TZ:-Africa/Nairobi}"
    ports:
      - "127.0.0.1:${MC_UI_PORT:-4570}:8080"
      - "127.0.0.1:${MC_GATEWAY_PORT:-4571}:4566"
    volumes:
      - "${MC_DATA_DIR:-./data}:/var/lib/ministack/control:Z"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
