name: ministack-control

services:
  # First-setup init job: applies `bootstrap/template.yml` as the
  # `ministack-control` stack, which owns the ten DynamoDB tables the control
  # stores itself in. Not a long-running service — `scripts/up.sh` runs it to
  # completion before the control starts, and the control refuses to serve when
  # the tables are missing. Idempotent: an existing stack is left alone.
  bootstrap:
    image: "${MC_IMAGE:-ghcr.io/mathewmusango/ministack-control:latest}"
    restart: "no"
    env_file:
      - path: ./.env
        required: false
    environment:
      TZ: "${TZ:-Africa/Nairobi}"
      # Derived, not configured: the control reaches the emulator at the
      # container it starts next to. Set MC_EMULATOR_CONTAINER to move it.
      MINISTACK_NODE_URL: "http://${MC_EMULATOR_CONTAINER:-ministack}:${CONTROL_GATEWAY_PORT:-4566}"
    command: ["python", "/app/bootstrap/apply.py"]

  ministack-control:
    image: "${MC_IMAGE:-ghcr.io/mathewmusango/ministack-control:latest}"
    restart: "no"
    env_file:
      - path: ./.env
        required: false
    environment:
      TZ: "${TZ:-Africa/Nairobi}"
      # Same derivation as the init job: one place names the emulator container.
      MINISTACK_NODE_URL: "http://${MC_EMULATOR_CONTAINER:-ministack}:${CONTROL_GATEWAY_PORT:-4566}"
    ports:
      - "127.0.0.1:${MC_UI_PORT:-4570}:8080"
      - "127.0.0.1:${MC_GATEWAY_PORT:-4571}:4566"
    # No volumes: the console is stateless, and the control's state lives in the
    # emulator's DynamoDB. Nothing here needs a host directory.
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
